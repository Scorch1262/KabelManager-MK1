name: Build Windows EXE + macOS App

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            artifact_name: Kabelplan-Windows
            sep: ";"
            binary_name: Kabelplan.exe
            release_name: Kabelplan-Windows.exe
          - os: macos-latest
            artifact_name: Kabelplan-macOS
            sep: ":"
            binary_name: Kabelplan
            release_name: Kabelplan-macOS
    runs-on: ${{ matrix.os }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Abhaengigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Mit PyInstaller bauen
        run: >
          pyinstaller --onefile --name Kabelplan
          --hidden-import tkinter
          app.py

      - name: Begleitdateien beilegen (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          mkdir -p dist_out
          cp dist/${{ matrix.binary_name }} dist_out/
          cp README.md dist_out/
          cp VERSION dist_out/

      - name: Begleitdateien beilegen (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          mkdir -p dist_out
          cp dist/${{ matrix.binary_name }} dist_out/
          cp README.md dist_out/
          cp VERSION dist_out/
          chmod +x dist_out/${{ matrix.binary_name }}

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: dist_out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Windows-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: Kabelplan-Windows
          path: artifacts/windows

      - name: macOS-Artefakt herunterladen
        uses: actions/download-artifact@v4
        with:
          name: Kabelplan-macOS
          path: artifacts/macos

      - name: Release-Dateien vorbereiten
        run: |
          mkdir -p release
          cp artifacts/windows/Kabelplan.exe release/Kabelplan-Windows.exe
          cp artifacts/macos/Kabelplan release/Kabelplan-macOS
          cp README.md release/
          cp VERSION release/

      - name: GitHub Release erstellen
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/Kabelplan-Windows.exe
            release/Kabelplan-macOS
            release/README.md
            release/VERSION
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
